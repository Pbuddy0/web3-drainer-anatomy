<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Web3 Drainer Anatomy — how wallet drainers steal funds, and how to stop them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#223054" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

  <!-- signature line morphing into a shield -->
  <g transform="translate(70,150)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 30 C 25 -10, 45 60, 70 20 S 115 -15, 140 25 S 180 55, 205 10"
          stroke="#5b6b93" stroke-width="3" opacity="0.9"/>
    <circle cx="215" cy="12" r="4" fill="#ff5a5a" stroke="none"/>
    <path d="M245 -28 l24 10 v26 c0 18 -11 30 -24 38 c-13 -8 -24 -20 -24 -38 v-26 z"
          fill="#101830" stroke="url(#accent)" stroke-width="4"/>
    <path d="M236 6 l7 8 l14 -16" stroke="#7ef0b2" stroke-width="4"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="420" y="128" font-size="58" font-weight="700" fill="#f4f6fb" letter-spacing="1">WEB3 DRAINER</text>
    <text x="420" y="192" font-size="58" font-weight="700" fill="url(#accent)" letter-spacing="1">ANATOMY</text>
    <text x="422" y="236" font-size="24" fill="#9fb0d4">One valid signature is all it takes.</text>
    <text x="422" y="264" font-size="19" fill="#66779e">A payload-level field guide for developers &amp; defenders</text>
  </g>
</svg>
